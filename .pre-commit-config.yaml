minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

# Reuse uv.lock's tools and the synchronized project environment. --no-sync
# preserves optional inference packages and avoids environment changes during Git hooks.
repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint (whole project)
        entry: uv run --locked --no-sync ruff check .
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check (whole project)
        entry: uv run --locked --no-sync ruff format --check .
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty type check (application source)
        entry: uv run --locked --no-sync ty check
        language: unsupported
        pass_filenames: false
        always_run: true
